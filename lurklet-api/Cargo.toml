[package]
name = "lurklet-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The lurklet API server"
publish = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
blake3 = "1.8.7"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
clap.workspace = true
client-ip = "0.2.1"
form_urlencoded = "1.2.2"
futures-util = "0.3.34"
governor = "0.10.4"
headers = "0.4.2"
http-serde = "2.1.1"
ipnet = "2.12.2"
lurklet-reddit.workspace = true
mediatype = "0.23.0"
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
serde.workspace = true
serde_json.workspace = true
tempfile = "3.27.0"
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "fs", "io-util"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["fs", "set-header", "compression-gzip", "compression-br", "compression-deflate", "compression-zstd"] }
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa = { workspace = true, features = ["chrono"] }
utoipa-axum.workspace = true
wreq.workspace = true
weak-table = "0.4.0"

[dev-dependencies]
assert_cmd.workspace = true
assert_fs = "1.1.4"
brotli = "9.0.0"
flate2 = "1.1.10"
insta.workspace = true
zstd = "0.14.3"
tokio = { workspace = true, features = ["io-util", "sync", "time"] }
