[workspace]
members = ["lurklet-api", "lurklet-reddit", "lurklet-reddit-cli"]
resolver = "3"

[profile.release]
debug-assertions = true

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
create_dir = "warn"
else_if_without_else = "warn"
filetype_is_file = "warn"
infinite_loop = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"

# Pedantic
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
get_unwrap = "warn"
iter_over_hash_type = "warn"
print_stderr = "warn"
print_stdout = "warn"
redundant_test_prefix = "warn"
redundant_type_annotations = "warn"
str_to_string = "warn"
todo = "warn"
unneeded_field_pattern = "warn"
wildcard_dependencies = "warn"
redundant_feature_names = "warn"
negative_feature_names = "warn"
cargo_common_metadata = "warn"
absolute_paths = "warn"

[workspace.dependencies]
anyhow = "1.0.104"
assert_cmd = "2.2.2"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
http = "1.5.0"
insta = { version = "1.49.0", features = ["json"] }
lurklet-reddit = { path = "lurklet-reddit", version = "0.2.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = "1.54.1"
tower = { version = "0.5.3", features = ["filter"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-axum = "0.3.0"
wiremock = "0.6.5"
wreq = { version = "0.16.1", features = ["json", "gzip", "brotli"] }
